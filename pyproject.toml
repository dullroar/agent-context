[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context"
version = "0.1.0"
description = "Local session pointer registry"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
agent-context = "agent_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
